kind = "web"
previewPath = "/"
title = "WaterIntel"
version = "1.0.0"
id = "artifacts/waterintel"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20524

[services.development]
run = "pnpm --filter @workspace/waterintel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/waterintel", "run", "build" ]
serve = "static"
publicDir = "artifacts/waterintel/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20524"
BASE_PATH = "/"
